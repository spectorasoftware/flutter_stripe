name: flutter_stripe_web
description: Stripe sdk bindings for the Flutter web platform. This package contains the implementation of the platform interface for web.
version: 7.0.0
homepage: https://github.com/flutter-stripe/flutter_stripe

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  stripe_platform_interface:
    path: ../stripe_platform_interface
  stripe_js:
    path: ../stripe_js
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.2
  freezed: ^2.5.7
  json_serializable: ^6.5.4
  lints: ^5.1.1

flutter:
  plugin:
    platforms:
      web:
        pluginClass: WebStripe
        fileName: flutter_stripe_web.dart
